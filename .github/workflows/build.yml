name: Build Tweak

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libxml2-dev \
            libzip-dev \
            libncurses5-dev \
            libreadline-dev \
            libbz2-dev \
            liblzma-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libffi-dev \
            perl \
            devscripts \
            dpkg-dev \
            debmake

      - name: Install THEOS
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          ref: master

      - name: Install iOS SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: sdks
          ref: master

      - name: Setup THEOS
        run: |
          sudo mv theos /usr/local/theos
          sudo mv sdks /usr/local/theos/sdks
          echo "THEOS=/usr/local/theos" >> $GITHUB_ENV
          echo "/usr/local/theos/bin" >> $GITHUB_PATH

      - name: Build Tweak
        run: |
          make package

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: RevolutDevModeSpoof
          path: packages/*.deb
