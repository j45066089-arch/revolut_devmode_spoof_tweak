name: Build Tweak

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y \
            clang \
            libxml2-dev \
            libzip-dev \
            libncurses5-dev \
            libreadline-dev \
            libbz2-dev \
            liblzma-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libffi-dev \
            perl \
            devscripts \
            dpkg-dev \
            dctrl-tools

      - name: Setup THEOS and iOS SDK
        uses: qiaojiajun/setup-theos@main
        with:
          theos-version: master
          sdk-version: 15.6

      - name: Build Tweak
        run: |
          make package

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: RevolutDevModeSpoof
          path: packages/*.deb
