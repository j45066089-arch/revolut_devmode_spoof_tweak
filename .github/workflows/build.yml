name: Build Tweak

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libxml2-dev \
            libzip-dev \
            libncurses5-dev \
            libreadline-dev \
            libbz2-dev \
            liblzma-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libffi-dev

      - name: Install THEOS
        run: |
          curl -sL https://raw.githubusercontent.com/theos/theos/master/install-theos.sh | bash
          echo "THEOS=/home/runner/work/_temp/theos" >> $GITHUB_ENV
          echo "/home/runner/work/_temp/theos/bin" >> $GITHUB_PATH
          echo "/home/runner/work/_temp/theos/pkg/theos/scripts" >> $GITHUB_PATH

      - name: Build Tweak
        run: |
          make package

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: RevolutDevModeSpoof
          path: packages/*.deb
